name: Release

on:
  workflow_dispatch:
    inputs:
      draft:
        description: 'Draft release'
        required: false
        default: false
        type: boolean
      prerelease:
        description: 'Prerelease'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxrandr-dev libgl1-mesa-dev

      - name: Build 64-bit targets using build.c
        run: |
          set -euo pipefail

          PROGRAM="$(./build.c program-name | awk -F': ' '/CMD Name/ {print $2}')"

          mkdir -p dist

          echo "Building ${PROGRAM} for Linux x86_64..."
          ./build.c build release --arch=x86_64
          cp "build/${PROGRAM}" "dist/${PROGRAM}-linux-x86_64"
          tar -czf "dist/${PROGRAM}-linux-x86_64.tar.gz" -C dist "${PROGRAM}-linux-x86_64"

          echo "Building ${PROGRAM} for Windows x86_64..."
          ./build.c build release --arch=x86_64 --mingw
          cp "build/${PROGRAM}.exe" "dist/${PROGRAM}-windows-x86_64.exe"
          zip -j "dist/${PROGRAM}-windows-x86_64.zip" "dist/${PROGRAM}-windows-x86_64.exe"

          cd dist
          sha256sum *.tar.gz *.zip > SHA256SUMS.txt
          cd ..

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PROGRAM="$(./build.c program-name | awk -F': ' '/CMD Name/ {print $2}')"
          VERSION="$("./dist/${PROGRAM}-linux-x86_64" -v | tr -d '\r' | xargs)"
          TAG_NAME="${PROGRAM}-${VERSION}"
          TITLE="${PROGRAM}-${VERSION}"

          EXTRA_FLAGS=()
          if [ "${{ inputs.draft }}" = "true" ]; then
            EXTRA_FLAGS+=("--draft")
          fi
          if [ "${{ inputs.prerelease }}" = "true" ]; then
            EXTRA_FLAGS+=("--prerelease")
          fi

          gh release create "$TAG_NAME" \
            dist/*.tar.gz \
            dist/*.zip \
            dist/SHA256SUMS.txt \
            --title "$TITLE" \
            --generate-notes \
            ${EXTRA_FLAGS[@]+"${EXTRA_FLAGS[@]}"}
